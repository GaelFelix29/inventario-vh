<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#198754">

    <meta name="csrf-token" content="{{ csrf_token() }}">

    <script src="{{ url_for('static', filename='js/csrf.js') }}" defer></script>

    <title>{% block titulo %}Vital Health{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/qr.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block estilos %}
    {% endblock %}

</head>

<body>


    <header class="topbar">

        <button class="icon-btn" id="menuBtn">

            <i class="bi bi-list"></i>

        </button>

        <div class="topbar-center">

            <h1>VITAL HEALTH</h1>

            <small>Sistema de Activos</small>

        </div>

        <button class="icon-btn">

            <i class="bi bi-bell"></i>

        </button>

    </header>

    <!-- Drawer -->

    <div class="drawer" id="drawer">

        <div class="drawer-header">

            <h3>VITAL HEALTH</h3>

            <small>{{ session["nombre"] }}</small>

        </div>

        <a href="/">
            <i class="bi bi-house-door"></i>
            Inicio
        </a>

        <a href="{{ url_for('dashboard_mobil') }}">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="{{ url_for('maquinarias_mobile') }}">
            <i class="bi bi-pc-display"></i>
            Maquinaria
        </a>

        <a href="{{ url_for('aduanas_mobile') }}">
            <i class="bi bi-truck"></i>
            Aduanas
        </a>

        {% if session.get("rol")=="Administrador" %}

        <a href="/usuarios">

            <i class="bi bi-people"></i>

            Usuarios

        </a>

        {% endif %}

        <hr>

        <a href="/logout" class="logout">

            <i class="bi bi-box-arrow-right"></i>

            Cerrar sesión

        </a>

    </div>

    <div class="drawer-overlay" id="overlay"></div>

    <!-- Contenido -->

    <main class="contenido">

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/html5-qrcode"></script>

        {% block contenido %}

        {% endblock %}

    </main>

    <script>

        const menuBtn = document.getElementById("menuBtn");

        const drawer = document.getElementById("drawer");

        const overlay = document.getElementById("overlay");

        menuBtn.onclick = () => {

            drawer.classList.add("open");

            overlay.classList.add("show");

        };

        overlay.onclick = () => {

            drawer.classList.remove("open");

            overlay.classList.remove("show");

        };

    </script>



</body>

</html>
