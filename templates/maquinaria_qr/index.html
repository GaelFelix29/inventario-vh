{% extends "maquinaria_qr/base_mobile.html" %}

{% block titulo %}
Inicio
{% endblock %}

{% block contenido %}

<div class="container py-4">

    <!-- Bienvenida -->
    <div class="text-center mb-4">

        <div class="mb-3">
            <i class="bi bi-box-seam-fill text-success display-3"></i>
        </div>

        <h2 class="fw-bold text-success">
            VITAL HEALTH
        </h2>

        <p class="text-muted mb-0">
            Sistema de Inventario
        </p>

    </div>

    <!-- Buscador -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">

        <div class="card-body">

            <label class="fw-semibold mb-2">

                <i class="bi bi-search"></i>

                Buscar activo

            </label>

            <div class="position-relative">

                <input type="text" id="buscarActivo" class="form-control form-control-lg rounded-4"
                    placeholder="Buscar activo...">

                <div id="resultadoBusqueda" class="mt-2">
                </div>

            </div>

        </div>

    </div>

    <!-- Módulos -->

    <h6 class="text-uppercase text-muted fw-bold mb-3">
        Módulos
    </h6>

    <div class="d-grid gap-3">

        <a href="#" class="card border-0 shadow-sm rounded-4 text-decoration-none">

            <div class="card-body d-flex justify-content-between align-items-center">

                <div>

                    <i class="bi bi-speedometer2 fs-2 text-success"></i>

                    <div class="fw-bold mt-2">
                        Dashboard
                    </div>

                    <small class="text-muted">
                        Indicadores generales
                    </small>

                </div>

                <i class="bi bi-chevron-right fs-4 text-muted"></i>

            </div>

        </a>

        <a href="#" class="card border-0 shadow-sm rounded-4 text-decoration-none">

            <div class="card-body d-flex justify-content-between align-items-center">

                <div>

                    <i class="bi bi-box-seam fs-2 text-success"></i>

                    <div class="fw-bold mt-2">
                        Maquinarias
                    </div>

                    <small class="text-muted">
                        Consultar activos
                    </small>

                </div>

                <i class="bi bi-chevron-right fs-4 text-muted"></i>

            </div>

        </a>

        <a href="#" class="card border-0 shadow-sm rounded-4 text-decoration-none">

            <div class="card-body d-flex justify-content-between align-items-center">

                <div>

                    <i class="bi bi-file-earmark-text fs-2 text-success"></i>

                    <div class="fw-bold mt-2">
                        Aduanas
                    </div>

                    <small class="text-muted">
                        Expedientes aduanales
                    </small>

                </div>

                <i class="bi bi-chevron-right fs-4 text-muted"></i>

            </div>

        </a>

    </div>

</div>

<script>

const txtBuscar = document.getElementById("buscarActivo");
const resultados = document.getElementById("resultadoBusqueda");

txtBuscar.addEventListener("input", buscarActivos);

async function buscarActivos() {

    const texto = txtBuscar.value.trim();

    if (texto.length < 2) {

        resultados.innerHTML = "";

        return;

    }

    try {

        const respuesta = await fetch(
            "/buscar-activos?q=" + encodeURIComponent(texto)
        );

        const activos = await respuesta.json();

        resultados.innerHTML = "";

        if (activos.length === 0) {

            resultados.innerHTML = `
                <div class="text-center text-muted py-3">
                    No se encontraron activos
                </div>
            `;

            return;

        }

        activos.forEach(activo => {

            resultados.innerHTML += `
                <div class="card shadow-sm border-0 rounded-4 mb-2 resultado-activo"
                     data-id="${activo.id}">

                    <div class="card-body">

                        <div class="fw-bold text-success">
                            <i class="bi bi-box-seam"></i>
                            ${activo.id}
                        </div>

                        <div class="small mt-1">
                            ${activo.descripcion}
                        </div>

                        <div class="small text-muted">
                            <i class="bi bi-geo-alt"></i>
                            ${activo.ubicacion || "Sin ubicación"}
                        </div>

                    </div>

                </div>
            `;

        });

        document.querySelectorAll(".resultado-activo").forEach(card => {

            card.addEventListener("click", function () {

                window.location =
                    "/maquinarias/" + this.dataset.id;

            });

        });

    } catch (error) {

        console.error(error);

    }

}

</script>



{% endblock %}
