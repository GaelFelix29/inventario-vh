<section class="mapa-panel" aria-labelledby="mapaTitulo" data-endpoint="{{ url_for('dashboard_mapa_datos') }}">
    <header class="mapa-panel__header">
        <div><small>DISTRIBUCIÓN DEL INVENTARIO</small><h2 id="mapaTitulo"><i class="bi bi-geo-alt"></i> Activos por ubicación</h2><p>Explore las sedes y consulte cuántos activos hay en cada una.</p></div>
        <button type="button" id="mapaVerTodas" disabled>Ver todas las sedes</button>
    </header>
    <p id="mapaEstado" class="mapa-panel__estado" role="status">Cargando ubicaciones…</p>
    <div class="mapa-panel__contenido">
        <div id="mapaActivos" aria-label="Mapa de ubicaciones del inventario"></div>
        <aside class="mapa-leyenda" aria-label="Leyenda de ubicaciones">
            <label for="mapaBuscar">Buscar sede</label>
            <input id="mapaBuscar" type="search" placeholder="Nombre de ubicación…" autocomplete="off">
            <div id="mapaLista" class="mapa-leyenda__lista"></div>
        </aside>
    </div>
    <footer class="mapa-panel__footer"><span>Seleccione un pin o una sede de la leyenda.</span><a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">Reportar un error del mapa</a></footer>
</section>
