<link rel="stylesheet" href="{{ url_for('static', filename='css/recepcion.css', v='20260918-1') }}">
<dialog id="modalRecepcion" class="recepcion" aria-labelledby="tituloRecepcion" aria-describedby="ayudaRecepcion">
    <form method="POST" enctype="multipart/form-data"
          action="{{ url_for('confirmar_recepcion_route', id_activo=activo_recepcion.id_activo) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="origen" value="{{ origen_recepcion }}">

        <header class="recepcion__encabezado">
            <span class="recepcion__icono"><i class="bi bi-box-seam" aria-hidden="true"></i></span>
            <div>
                <span class="recepcion__etiqueta">Recepción del activo</span>
                <h2 id="tituloRecepcion">Confirmar recepción</h2>
            </div>
            <button type="button" class="recepcion__cerrar" aria-label="Cerrar formulario"
                    onclick="this.closest('dialog').close()"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
        </header>

        <div class="recepcion__contenido">
            <div class="recepcion__activo">
                <i class="bi bi-truck" aria-hidden="true"></i>
                <div><strong>{{ activo_recepcion.id_activo }}</strong>
                    {% if activo_recepcion.descripcion %}<span>{{ activo_recepcion.descripcion }}</span>{% endif %}
                </div>
                <span class="recepcion__estado">En traslado</span>
            </div>

            <h3>Foto del activo recibido <span class="recepcion__obligatorio">Obligatoria</span></h3>
            <p id="ayudaRecepcion" class="recepcion__ayuda">Toma una foto o elige una que ya tengas.</p>
            <div class="recepcion__opciones">
                <button type="button" class="recepcion__opcion recepcion__opcion--camara" id="tomarFotoRecepcion">
                    <span class="recepcion__opcion-icono"><i class="bi bi-camera" aria-hidden="true"></i></span>
                    <strong>Tomar foto</strong><span>Abrir cámara</span>
                </button>
                <button type="button" class="recepcion__opcion" id="subirFotoRecepcion">
                    <span class="recepcion__opcion-icono"><i class="bi bi-images" aria-hidden="true"></i></span>
                    <strong>Elegir imagen</strong><span>Desde tu galería</span>
                </button>
            </div>
            <label class="recepcion__solo-lector" for="fotoRecepcion">Foto de recepción</label>
            <input id="fotoRecepcion" class="recepcion__solo-lector" type="file" name="foto_recepcion"
                   accept="image/jpeg,image/png,image/webp" aria-describedby="limiteRecepcion errorRecepcion" required tabindex="-1">

            <figure id="contenedorVistaRecepcion" class="recepcion__vista" hidden>
                <img id="vistaRecepcion" alt="Vista previa del activo recibido" hidden>
                <figcaption><span><i class="bi bi-check-circle-fill" aria-hidden="true"></i> Foto lista</span>
                    <button type="button" id="quitarFotoRecepcion">Quitar foto</button></figcaption>
            </figure>
            <p id="limiteRecepcion" class="recepcion__limite">JPG, PNG o WEBP · Hasta 8 MB</p>
            <p id="errorRecepcion" role="alert" class="recepcion__error"></p>

            <label class="recepcion__label" for="observacionesRecepcion">Observaciones <span>Opcional</span></label>
            <textarea id="observacionesRecepcion" name="observaciones" maxlength="500" rows="3"
                      placeholder="¿Algo que debamos saber sobre cómo llegó el activo?"></textarea>
        </div>

        <footer class="recepcion__pie">
            <button type="button" class="recepcion__cancelar" onclick="this.closest('dialog').close()">Cancelar</button>
            <button id="enviarRecepcion" type="submit" class="recepcion__confirmar" disabled>
                <i class="bi bi-check2-circle" aria-hidden="true"></i> Confirmar recepción
            </button>
        </footer>
    </form>
</dialog>
<script>
(() => {
    const dialogo = document.getElementById('modalRecepcion');
    const formulario = dialogo.querySelector('form');
    const archivo = document.getElementById('fotoRecepcion');
    const vista = document.getElementById('vistaRecepcion');
    const contenedor = document.getElementById('contenedorVistaRecepcion');
    const enviar = document.getElementById('enviarRecepcion');
    const error = document.getElementById('errorRecepcion');
    const quitar = document.getElementById('quitarFotoRecepcion');
    const camara = document.getElementById('tomarFotoRecepcion');
    const galeria = document.getElementById('subirFotoRecepcion');
    let url = null;
    let enviando = false;
    let version = 0;

    function limpiarFoto() {
        version++;
        enviar.disabled = true; vista.hidden = true; contenedor.hidden = true;
        error.textContent = ''; vista.onload = null; vista.onerror = null;
        vista.removeAttribute('src');
        if (url) { URL.revokeObjectURL(url); url = null; }
    }
    camara.onclick = () => { archivo.setAttribute('capture', 'environment'); archivo.click(); };
    galeria.onclick = () => { archivo.removeAttribute('capture'); archivo.click(); };
    quitar.onclick = () => { limpiarFoto(); archivo.value = ''; camara.focus(); };
    archivo.onchange = () => {
        limpiarFoto();
        const foto = archivo.files[0];
        if (!foto) return;
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(foto.type) || foto.size > 8 * 1024 * 1024 || !foto.size) {
            error.textContent = 'Selecciona una imagen JPG, PNG o WEBP de hasta 8 MB.';
            archivo.value = ''; return;
        }
        const seleccion = version;
        vista.onload = () => {
            if (seleccion !== version) return;
            vista.hidden = false; contenedor.hidden = false; enviar.disabled = false;
        };
        vista.onerror = () => {
            if (seleccion !== version) return;
            error.textContent = 'No se pudo leer la imagen. Intenta con otra foto.'; archivo.value = '';
        };
        url = URL.createObjectURL(foto); vista.src = url;
    };
    formulario.onsubmit = (evento) => {
        if (enviando || enviar.disabled || !archivo.files.length) { evento.preventDefault(); return; }
        enviando = true; enviar.disabled = true; enviar.textContent = 'Guardando recepción…';
        camara.disabled = true; galeria.disabled = true; quitar.disabled = true;
        dialogo.querySelectorAll('button[type="button"]').forEach(boton => { boton.disabled = true; });
    };
    dialogo.addEventListener('cancel', evento => { if (enviando) evento.preventDefault(); });
    dialogo.addEventListener('close', () => {
        if (enviando) return;
        formulario.reset(); limpiarFoto();
    });
})();
</script>
